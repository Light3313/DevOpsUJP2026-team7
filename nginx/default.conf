server {
    listen 80;
    server_name devopswiki.pp.ua www.devopswiki.pp.ua grafana.devopswiki.pp.ua;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name devopswiki.pp.ua www.devopswiki.pp.ua;

    ssl_certificate /etc/letsencrypt/live/devopswiki.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devopswiki.pp.ua/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name grafana.devopswiki.pp.ua;

    ssl_certificate /etc/letsencrypt/live/devopswiki.pp.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devopswiki.pp.ua/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}