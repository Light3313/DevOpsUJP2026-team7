include:
  - monitoring/docker-compose.yml
services:
  wiki-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - wiki_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  wiki:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WIKI_PORT:-9000}:80"
    depends_on:
      wiki-db:
        condition: service_healthy
    volumes:
      - wiki_images:/var/www/html/images
      # LocalSettings.php не зберігається в git, кладеться в config/
      - ./config/LocalSettings.php:/var/www/html/LocalSettings.php:ro

volumes:
  wiki_db_data:
  wiki_images:
