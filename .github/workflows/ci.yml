name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare .env file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint backup script with ShellCheck
        run: shellcheck backup/backup-mywiki.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with GHA cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/Light3313/DevOpsUJP2026-team7
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            mediawiki-app:${{ github.sha }}
            ci-wiki:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test MediaWiki
        run: |
          set -a; . ./.env; set +a
          # LocalSettings.php немає в git: генеруємо тестовий інсталятором MediaWiki
          mkdir -p config
          docker compose up -d --wait wiki-db
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" -v "$PWD/config:/out" ci-wiki:latest \
            php maintenance/install.php --dbtype=mysql --dbserver=wiki-db \
            --dbname="$MYSQL_DATABASE" --dbuser="$MYSQL_USER" --dbpass="$MYSQL_PASSWORD" \
            --server="http://localhost:${WIKI_PORT}" --scriptpath="" \
            --pass="$(openssl rand -hex 16)" --confpath=/out "CI Wiki" Admin
          docker compose up -d --no-build wiki
          for i in $(seq 1 60); do
            if curl -fsL "http://localhost:${WIKI_PORT}/" > /dev/null; then
              echo "MediaWiki is responding on port ${WIKI_PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: MediaWiki did not respond in time"
          docker compose logs wiki-db wiki
          exit 1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested ARM64 image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/light3313/devopsujp2026-team7
        run: |
          set -euo pipefail
          test "$(docker image inspect -f '{{.Architecture}}' ci-wiki:latest)" = arm64
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' ci-wiki:latest)" = "$GITHUB_SHA"
          DEST="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker tag ci-wiki:latest "$DEST"
          docker push "$DEST"
          echo "Published $DEST"

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
