name: CI Pipeline

on:
push:
branches: [ "main" ]
pull_request:
branches: [ "main" ]

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 15
env:
  COMPOSE_PROJECT_NAME: ci

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Prepare .env file
    run: cp .env.example .env

  - name: Validate Docker Compose configuration
    run: docker compose config -q

  - name: Lint Dockerfile with Hadolint
    uses: hadolint/hadolint-action@v3.1.0
    with:
      dockerfile: Dockerfile
      failure-threshold: warning

  - name: Lint backup script with ShellCheck
    run: shellcheck backup/backup-mywiki.sh

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Build Docker image with GHA cache
    uses: docker/build-push-action@v5
    with:
      context: .
      file: ./Dockerfile
      push: false
      load: true
      tags: |
        mediawiki-app:${{ github.sha }}
        ci-wiki:latest
      cache-from: type=gha
      cache-to: type=gha,mode=max

  - name: Smoke test MediaWiki
    run: |
      docker compose up -d --no-build wiki-db wiki
      for i in $(seq 1 60); do
        if curl -fs http://localhost:9001/ > /dev/null; then
          echo "MediaWiki is responding on port 9001"
          exit 0
        fi
        sleep 2
      done
      echo "Smoke test failed: MediaWiki did not respond in time"
      docker compose logs wiki-db wiki
      exit 1

  - name: Tear down Docker Compose stack
    if: always()
    run: docker compose down -v
